name: Publish to the MCP Registry

# Run by hand after the staged npm version has been approved: the registry only stores metadata and checks that the package is on npm.
# It authenticates with GitHub's OIDC identity, so no token is needed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version approved on npm, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      PUBLISHER_VERSION: v1.8.10
      PUBLISHER_SHA256: 32d287ed6fb7dc04eddd2621097784c06a355b2348b35ccc630a1643aa75ff4a
    steps:
      - name: Check the version
        run: |
          set -eu
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a version"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Check the package is live on npm
        run: |
          set -eu
          live=$(npm view "@mmoonport-labs/unifi-mcp@$VERSION" version 2>/dev/null || true)
          [ "$live" = "$VERSION" ] || { echo "::error::@mmoonport-labs/unifi-mcp@$VERSION is not on npm yet: approve the staged version first"; exit 1; }
      - name: Install mcp-publisher (pinned and checked)
        run: |
          set -eu
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf mcp-publisher.tar.gz -C "$RUNNER_TEMP/bin" mcp-publisher
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: mcp-publisher validate
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
